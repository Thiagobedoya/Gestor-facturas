{% extends "base.html" %}

{% block titulo %}Nueva factura{% endblock %}

{% block contenido %}
    <h1>Registrar nuevo cliente</h1>
    <form method="POST">
        <label for="nombre">Nombre:</label>
        <input class="nombre_cliente_nuevo" type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Email:</label>
        <input class="email_cliente_nuevo" type="email" id="email" name="email"><br><br>

        <label for="telefono">Teléfono:</label>
        <input class="telefono_cliente_nuevo" type="text" id="telefono" name="telefono"><br><br>

        <label for="direccion">Dirección:</label>
        <input class="direccion_cliente_nuevo" type="text" id="direccion" name="direccion"><br><br>

        <label for="ciudad">Ciudad:</label>
        <input class="ciudad_cliente_nuevo" type="text" id="ciudad" name="ciudad"><br><br>

        <label for="pais">País:</label>
        <input class="pais_cliente_nuevo" type="text" id="pais" name="pais"><br><br>

        <button type="submit">Guardar cliente</button>
    </form>
{% endblock %}
